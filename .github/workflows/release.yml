# Builds, signs, and publishes a Grafana plugin release.
# (For more information, see https://github.com/grafana/plugin-actions/blob/main/build-plugin/README.md)
#
# The git tag is created when the GitHub release is published, after signing
# succeeds. Callers that detect a version bump on main invoke this workflow
# with workflow_call instead of pushing the tag themselves: a tag push from
# the default GITHUB_TOKEN does not start workflows.
name: Release

on:
  push:
    tags:
      - 'v*' # Run workflow on version tags, e.g. v1.0.0.
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to create for the release. Defaults to v<plugin version>.'
        required: false
        type: string
      commit_sha:
        description: 'Commit to build and tag. Defaults to the workflow SHA.'
        required: false
        type: string
  workflow_call:
    inputs:
      tag_name:
        description: 'Tag to create for the release. Must be v<plugin version>.'
        required: true
        type: string
      commit_sha:
        description: 'Commit to build and tag.'
        required: true
        type: string

# Serialize publishes so a version bump and a tag push cannot release at once.
# cancel-in-progress is false so a queued release is not dropped.
concurrency:
  group: plugin-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          persist-credentials: false

      - name: Require Grafana access policy token
        run: |
          if [ -z "${GRAFANA_ACCESS_POLICY_TOKEN}" ]; then
            echo "::error::GRAFANA_ACCESS_POLICY_TOKEN secret is required to sign the public plugin for release."
            echo "See https://grafana.com/developers/plugin-tools/publish-a-plugin/sign-a-plugin#generate-an-access-policy-token"
            exit 1
          fi

      - uses: grafana/plugin-actions/package-plugin@build-plugin/v1.0.2
        id: package-plugin
        with:
          go-version: '1.26.5'
          node-version: '22'
          # Signs the public plugin; requires GRAFANA_ACCESS_POLICY_TOKEN repo secret.
          policy_token: ${{ env.GRAFANA_ACCESS_POLICY_TOKEN }}

      - name: Verify plugin is signed
        run: |
          set -euo pipefail
          if [ ! -f "${PLUGIN_ID}/MANIFEST.txt" ]; then
            echo "::error::Expected ${PLUGIN_ID}/MANIFEST.txt after signing. Public releases must ship a signed plugin."
            exit 1
          fi
          echo "Found signed plugin manifest:"
          head -n 5 "${PLUGIN_ID}/MANIFEST.txt"
        env:
          PLUGIN_ID: ${{ steps.package-plugin.outputs.plugin-id }}

      - name: Repackage plugin for release
        id: release-package
        run: |
          set -euo pipefail

          release_tag="$(bash "${GITHUB_WORKSPACE}/.github/scripts/resolve-release-tag.sh")"
          echo "Release tag: ${release_tag}"

          rm -f "${ORIGINAL_ARCHIVE}" "${ORIGINAL_SHA1SUM}"
          if [ "${PLUGIN_ID}" != "${RELEASE_DIR}" ]; then
            rm -rf "${RELEASE_DIR}"
            mv "${PLUGIN_ID}" "${RELEASE_DIR}"
          fi

          if [ ! -f "${RELEASE_DIR}/MANIFEST.txt" ]; then
            echo "::error::Signed MANIFEST.txt missing from release package contents."
            exit 1
          fi

          archive="${RELEASE_DIR}-${PLUGIN_VERSION}.zip"
          archive_sha1sum="${archive}.sha1"
          zip "${archive}" "${RELEASE_DIR}" -r
          sha1sum "${archive}" | cut -f1 -d' ' > "${archive_sha1sum}"

          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          echo "archive-sha1sum=${archive_sha1sum}" >> "$GITHUB_OUTPUT"
          echo "release-tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "commit-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        env:
          ORIGINAL_ARCHIVE: ${{ steps.package-plugin.outputs.archive }}
          ORIGINAL_SHA1SUM: ${{ steps.package-plugin.outputs.archive-sha1sum }}
          PLUGIN_ID: ${{ steps.package-plugin.outputs.plugin-id }}
          PLUGIN_VERSION: ${{ steps.package-plugin.outputs.plugin-version }}
          RELEASE_DIR: foxglovedev-foxglove-datasource
          RELEASE_TAG: ${{ inputs.tag_name }}

      - name: Create Github release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          draft: false
          make_latest: "true"
          generate_release_notes: true
          tag_name: ${{ steps.release-package.outputs.release-tag }}
          target_commitish: ${{ steps.release-package.outputs.commit-sha }}
          files: |
            ./${{ steps.release-package.outputs.archive }}
            ./${{ steps.release-package.outputs.archive-sha1sum }}
