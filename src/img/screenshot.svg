<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Foxglove data source query editor</title>
  <desc id="desc">Illustration of the Foxglove Grafana data source query editor with controls for selecting devices, message paths, filters, and aggregation.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#25164f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#20283d"/>
      <stop offset="1" stop-color="#171d2e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#background)"/>
  <g opacity="0.25">
    <circle cx="1060" cy="120" r="180" fill="#ff5f57"/>
    <circle cx="170" cy="650" r="230" fill="#6f6cff"/>
  </g>
  <rect x="88" y="78" width="1104" height="564" rx="28" fill="url(#panel)" filter="url(#shadow)"/>
  <rect x="88" y="78" width="1104" height="64" rx="28" fill="#111827"/>
  <circle cx="126" cy="111" r="9" fill="#ff5f57"/>
  <circle cx="154" cy="111" r="9" fill="#ffbd2e"/>
  <circle cx="182" cy="111" r="9" fill="#28c840"/>
  <text x="226" y="119" fill="#d7def5" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Foxglove data source</text>
  <rect x="128" y="178" width="1024" height="86" rx="18" fill="#29334c"/>
  <text x="162" y="212" fill="#9fb0d8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Devices</text>
  <text x="162" y="244" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="25">robot-01, robot-02</text>
  <rect x="128" y="294" width="490" height="96" rx="18" fill="#29334c"/>
  <text x="162" y="329" fill="#9fb0d8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Message path</text>
  <text x="162" y="362" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="25">/vehicle/status.speed</text>
  <rect x="662" y="294" width="490" height="96" rx="18" fill="#29334c"/>
  <text x="696" y="329" fill="#9fb0d8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Aggregation</text>
  <text x="696" y="362" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="25">Average every 1m</text>
  <rect x="128" y="422" width="1024" height="162" rx="18" fill="#121927"/>
  <polyline points="170,534 275,500 380,512 485,452 590,474 695,430 800,462 905,404 1010,436 1110,390" fill="none" stroke="#ff6f61" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#ff6f61">
    <circle cx="170" cy="534" r="9"/>
    <circle cx="380" cy="512" r="9"/>
    <circle cx="590" cy="474" r="9"/>
    <circle cx="800" cy="462" r="9"/>
    <circle cx="1010" cy="436" r="9"/>
  </g>
  <text x="128" y="624" fill="#9fb0d8" font-family="Inter, Arial, sans-serif" font-size="20">Query Foxglove telemetry data directly in Grafana dashboards.</text>
</svg>
