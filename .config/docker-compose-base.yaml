services:
  grafana:
    user: root
    container_name: 'foxglovedev-foxglove-datasource'

    build:
      context: .
      args:
        grafana_image: ${GRAFANA_IMAGE:-grafana-enterprise}
        grafana_version: ${GRAFANA_VERSION:-12.2.0}
        development: ${DEVELOPMENT:-false}
        anonymous_auth_enabled: ${ANONYMOUS_AUTH_ENABLED:-true}
    ports:
      - 3000:3000/tcp
      - 2345:2345/tcp # delve
    security_opt:
      - 'apparmor:unconfined'
      - 'seccomp:unconfined'
    cap_add:
      - SYS_PTRACE
    volumes:
      - ../dist:/var/lib/grafana/plugins/foxglovedev-foxglove-datasource
      - ../provisioning:/etc/grafana/provisioning
      - ..:/root/foxglovedev-foxglove-datasource

    environment:
      NODE_ENV: development
      GF_LOG_FILTERS: plugin.foxglovedev-foxglove-datasource:debug
      GF_LOG_LEVEL: debug
      GF_DATAPROXY_LOGGING: 1
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: foxglovedev-foxglove-datasource
      GF_DEFAULT_APP_MODE: development
      FOXGLOVE_API_BASE_URL: ${FOXGLOVE_API_BASE_URL:-}
      FOXGLOVE_API_KEY: ${FOXGLOVE_API_KEY:-}
