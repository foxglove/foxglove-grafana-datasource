apiVersion: 1

datasources:
  - name: 'foxglove'
    type: 'foxglovedev-foxglove-datasource'
    access: proxy
    isDefault: false
    orgId: 1
    version: 1
    editable: true
    jsonData:
      baseUrl: ${FOXGLOVE_API_BASE_URL}
      projectId: ${FOXGLOVE_PROJECT_ID}
      siteId: ${FOXGLOVE_SITE_ID}
    secureJsonData:
      apiKey: ${FOXGLOVE_API_KEY}
